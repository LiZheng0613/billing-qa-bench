[project]
name = "billing-qa-platform"
version = "0.1.0"
description = "问账智能客服批量测试平台 - 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "aiomysql>=0.2.0,<0.4.0",
    "pymysql>=1.1.1,<2.0.0",
    "greenlet>=3.1.0,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.2,<0.29.0",
    "redis>=5.1.0,<9.0.0",
    "jsonpath-ng>=1.6.1,<2.0.0",
    "cryptography>=43.0.0,<51.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "python-multipart>=0.0.12,<0.1.0",
    "openpyxl>=3.1.5,<4.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "anyio>=4.6.0,<5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["billing_qa"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "FURB", "PYI"]
ignore = [
    # FastAPI 依赖注入的标准写法，B008 属误报
    "B008",
    # 中文全角标点是业务文案的组成部分，不视为歧义字符
    "RUF001",
    "RUF002",
    "RUF003",
    # 行宽由人工控制，中文注释与长文案不强制断行
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
