# Alembic configuration (sync driver for migrations)
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The database URL is not configured here: migrations/env.py injects it from
# application settings (settings.sync_database_url). Keep this file ASCII-only.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
